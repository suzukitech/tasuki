[test]
coverageThreshold = { lines = 0.8, functions = 0.8 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "packages/db/src/schema.ts", # declarations only; drizzle-kit callbacks never run in tests
  "apps/web/src/**/*.tsx",     # React components: covered by E2E in Phase 6b; unit tests cover the pure logic in src/lib
  "**/test/**",                # shared test helpers (fixture.ts, harness.ts) are not product code
]
